<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- 3D Ball Radial Gradient -->
    <radialGradient id="ballShade" cx="38%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="30%" stop-color="#ff6600"/>
      <stop offset="75%" stop-color="#cc3b00"/>
      <stop offset="100%" stop-color="#701a00"/>
    </radialGradient>
    <!-- Drop Shadow filter -->
    <filter id="ballGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#ballGlow)">
    <!-- Main Basketball Sphere -->
    <circle cx="16" cy="16" r="12.5" fill="url(#ballShade)" stroke="#220700" stroke-width="1.2"/>

    <!-- Seams / Ribs -->
    <path d="M 3.5 16 H 28.5" stroke="#1f0700" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 16 3.5 V 28.5" stroke="#1f0700" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 7.5 7.5 Q 12 16 7.5 24.5" fill="none" stroke="#1f0700" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 24.5 7.5 Q 20 16 24.5 24.5" fill="none" stroke="#1f0700" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Top Left Light Reflection -->
    <ellipse cx="12" cy="10" rx="3" ry="1.8" transform="rotate(-30 12 10)" fill="#ffffff" opacity="0.35"/>
  </g>
</svg>
