<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- 3D Ball Radial Gradient with Active Fiery Glow -->
    <radialGradient id="ballShadeActive" cx="36%" cy="34%" r="64%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="25%" stop-color="#ff7b00"/>
      <stop offset="70%" stop-color="#e03e00"/>
      <stop offset="100%" stop-color="#7a1500"/>
    </radialGradient>
    <filter id="auraGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ff7700" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <g filter="url(#auraGlow)">
    <!-- Main Basketball Sphere -->
    <circle cx="16" cy="16" r="13" fill="url(#ballShadeActive)" stroke="#220700" stroke-width="1.3"/>

    <!-- Seams / Ribs -->
    <path d="M 3 16 H 29" stroke="#1f0700" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 16 3 V 29" stroke="#1f0700" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 7 7 Q 11.8 16 7 25" fill="none" stroke="#1f0700" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 25 7 Q 20.2 16 25 25" fill="none" stroke="#1f0700" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Specular Highlight -->
    <ellipse cx="11.5" cy="9.5" rx="3.5" ry="2" transform="rotate(-30 11.5 9.5)" fill="#ffffff" opacity="0.45"/>
  </g>
</svg>
